<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>InternX</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#internships">Internships</a>
            <a href="#myApplications">My Applications</a>
            <a href="#saved">Saved</a>
        </nav>
    </header>
    <section class="home">
        <h2>Explore Internship Opportunities</h2>
        <p>Learn new skills and gain practical experience.</p>
        <a href="#internships">Explore Now</a>
    </section>
    <section class="internship" id="internships">
        <h2>Available Internships</h2>
        <div class="inputs">
            <input type="search" name="search" id="search" placeholder="Search Internships...." oninput="filterInternships()">
            <select name="select" id="category" onchange="filterInternships()">
                <option value="All">All Categories</option>
                <option value="Web Development">Web Development</option>
                <option value="Python">Python</option>
                <option value="Design">Design</option>
                <option value="Data Analysis">Data Analysis</option>
            </select>
        </div>
        <div class="intern" id="internshipList"></div>
    </section>
    <section class="myApplication" id="myApplications">
        <h2>My Applications</h2>
        <div class="application" id="applicationsList"></div>
    </section>
    <section class="saves" id="saved">
        <h2>Saved Internships</h2>
        <div class="saving" id="saveList"></div>
    </section>
    <footer>
        <p>&copy; InternX all rights reserved</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
